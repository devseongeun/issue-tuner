<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Issue Tuner 처리 흐름</title>
  <desc id="desc">Jira 또는 Issue Report 입력부터 재현, 진단, 수정, 독립 검증, 게시 승인 요청까지 이어진다. 승인되면 Draft PR 또는 MR을 만들고, 승인되지 않으면 요청을 보완한 뒤 승인을 다시 요청한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .step { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .step-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .step-label { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .approved { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .rejected { fill: none; stroke: #c2410c; stroke-width: 3; marker-end: url(#arrow-orange); }
      .branch-label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="720" height="1040" rx="24" fill="#f8fafc"/>
  <text x="360" y="52" text-anchor="middle" class="title">Issue Tuner 처리 흐름</text>
  <text x="360" y="80" text-anchor="middle" class="subtitle">Codex가 역할별 근거를 이어 받아 다음 단계로 진행합니다</text>

  <g>
    <rect x="180" y="110" width="360" height="72" rx="16" class="step"/>
    <text x="360" y="140" text-anchor="middle" class="step-title">Jira / Issue Report</text>
    <text x="360" y="164" text-anchor="middle" class="step-label">이슈 입력</text>
  </g>
  <path d="M360 182 V214" class="line"/>

  <g>
    <rect x="180" y="220" width="360" height="72" rx="16" class="step"/>
    <text x="360" y="250" text-anchor="middle" class="step-title">Reproducer</text>
    <text x="360" y="274" text-anchor="middle" class="step-label">재현</text>
  </g>
  <path d="M360 292 V324" class="line"/>

  <g>
    <rect x="180" y="330" width="360" height="72" rx="16" class="step"/>
    <text x="360" y="360" text-anchor="middle" class="step-title">Diagnoser</text>
    <text x="360" y="384" text-anchor="middle" class="step-label">원인 진단</text>
  </g>
  <path d="M360 402 V434" class="line"/>

  <g>
    <rect x="180" y="440" width="360" height="72" rx="16" class="step"/>
    <text x="360" y="470" text-anchor="middle" class="step-title">Implementer</text>
    <text x="360" y="494" text-anchor="middle" class="step-label">최소 수정</text>
  </g>
  <path d="M360 512 V544" class="line"/>

  <g>
    <rect x="180" y="550" width="360" height="72" rx="16" class="step"/>
    <text x="360" y="580" text-anchor="middle" class="step-title">Verifier</text>
    <text x="360" y="604" text-anchor="middle" class="step-label">독립 검증</text>
  </g>
  <path d="M360 622 V654" class="line"/>

  <g>
    <rect x="180" y="660" width="360" height="72" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="360" y="704" text-anchor="middle" class="step-title">게시 승인 요청</text>
  </g>

  <path d="M360 732 V898" class="approved"/>
  <text x="377" y="778" class="branch-label" fill="#2563eb">승인</text>
  <g>
    <rect x="180" y="906" width="360" height="76" rx="16" fill="#2563eb"/>
    <text x="360" y="952" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#ffffff">Draft PR/MR</text>
  </g>

  <path d="M540 696 H628 V816 H592" class="rejected"/>
  <text x="559" y="682" class="branch-label" fill="#c2410c">미승인</text>
  <g>
    <rect x="400" y="780" width="190" height="72" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="495" y="823" text-anchor="middle" class="step-title">요청 보완</text>
  </g>
  <path d="M495 780 V750 H568 V714 H548" class="rejected"/>
  <text x="490" y="766" text-anchor="middle" class="branch-label" fill="#c2410c">다시 승인 요청</text>
</svg>
